<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-label="Opsi D: tiga batang makna kata teknologi, perkembangan teknologi, dampak positif dan negatif teknologi"><style>.hbar{background:linear-gradient(#c2c2c2,#a5a5a5);border:1px solid #7f7f7f;padding:5px 10px;font-weight:bold;margin:20px 0 10px}.sumber{text-align:right;font-style:italic;margin:4px 0 16px;font-size:13px;color:#333}.petik{font-style:italic}.judul-teks{text-align:center;font-weight:bold;margin:12px 0 8px}.hal{display:inline-block;float:right;background:#8a8a8a;color:#fff;border-radius:9px;padding:1px 9px;font-size:11.5px;margin:2px 0 2px 10px}.toc{border:1.5px solid #979797;background:#f3f3f3;border-radius:6px;padding:12px 18px;margin:0 0 22px;font-size:14px}.note{font-size:12.5px;color:#555;border-top:1.5px solid #999;margin-top:34px;padding-top:10px;line-height:1.5}.lb{font-size:11px;fill:#141414;text-anchor:middle}.lbw{font-size:11px;fill:#fff;text-anchor:middle}.lbs{font-size:10px;fill:#141414;text-anchor:middle}.v1{fill:#bdbdbd;stroke:#fff;stroke-width:2.5}.v2{fill:#8e8e8e;stroke:#fff;stroke-width:2.5}.v3{fill:#a8a8a8;stroke:#fff;stroke-width:2.5}.c1{fill:#9d9d9d;stroke:#4d4d4d;stroke-width:1.6}.c2{fill:#8a8a8a;stroke:#4d4d4d;stroke-width:1.6}.c3{fill:#ababab;stroke:#4d4d4d;stroke-width:1.6}.bx{fill:#9d9d9d;stroke:#333;stroke-width:1.6}.bxd{fill:#6e6e6e;stroke:#333;stroke-width:1.6}.bxl{fill:#dedede;stroke:#333;stroke-width:1.6}.bxf{fill:#f5f5f5;stroke:#333;stroke-width:1.6}.ar{fill:#111}.arl{stroke:#111;stroke-width:3;fill:none;marker-end:url(#ah)}.cyc{fill:none;stroke-width:10}.tick{font-weight:bold;font-size:14px}.jb{font-weight:bold;margin:6px 0 6px 30px}.kbar{background:#383838;color:#fff;padding:8px 14px;font-weight:bold;font-size:19px;margin:34px 0 14px;border-radius:4px}.ksub{font-weight:bold;font-size:16px;margin:18px 0 8px}text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="100%" height="100%" fill="#ffffff"></rect>
