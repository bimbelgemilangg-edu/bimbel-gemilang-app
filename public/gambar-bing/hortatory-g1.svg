<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"><style>.banner h1{margin:0;font-size:34px;letter-spacing:3px;color:#141414}.chap .num{background:#383838;color:#fff;font-size:42px;font-weight:bold;padding:4px 22px;line-height:1.2}.chap .ttl{background:#c9c9c9;flex:1;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:bold;letter-spacing:1px;padding:10px}.hbar{background:linear-gradient(#c2c2c2,#a5a5a5);border:1px solid #7f7f7f;padding:5px 10px;font-weight:bold;margin:20px 0 10px}.sumber{text-align:right;font-style:italic;margin:4px 0 16px;font-size:13px;color:#333}.petik{font-style:italic}.tekslabel{font-weight:bold;margin:10px 0 6px}.cb.on::after{content:"\2713";position:absolute;left:0;top:-4px;font-size:13px;font-weight:bold;color:#111}.tick{font-weight:bold;font-size:14px}.jb{font-weight:bold;margin:6px 0 6px 30px}.hal{display:inline-block;float:right;background:#8a8a8a;color:#fff;border-radius:9px;padding:1px 9px;font-size:11.5px;margin:2px 0 2px 10px}.toc{border:1.5px solid #979797;background:#f3f3f3;border-radius:6px;padding:12px 18px;margin:0 0 22px;font-size:14px}.note{font-size:12.5px;color:#555;border-top:1.5px solid #999;margin-top:34px;padding-top:10px;line-height:1.5}.kbar{background:#383838;color:#fff;padding:8px 14px;font-weight:bold;font-size:19px;margin:34px 0 14px;border-radius:4px}.ksub{font-weight:bold;font-size:16px;margin:18px 0 8px}text{font-family:Arial,Helvetica,sans-serif}</style><rect width="100%" height="100%" fill="#fff"></rect>
