<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="520" fill="#F7FBFF"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0F3057">Cara Kerja Enzim: Model Kunci–Gembok &amp; Induced Fit</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#7E93AB">Diagram orisinal Tim Kurikulum Bimbel Gemilang</text>
  <!-- tahap 1 -->
  <g>
    <path d="M120 200 q 0 -60 60 -60 q 60 0 60 60 l 0 20 l -22 0 l 0 -18 q 0 -14 -12 -14 l -52 0 q -12 0 -12 14 l 0 18 l -22 0 z" fill="#BFDBFE" stroke="#0A5FC0" stroke-width="4"/>
    <rect x="150" y="120" width="18" height="26" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
    <rect x="192" y="120" width="18" height="26" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
    <text x="180" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#0F3057">1. Enzim + substrat spesifik</text>
    <text x="180" y="270" text-anchor="middle" font-size="12" fill="#7E93AB">bentuk substrat cocok dengan sisi aktif</text>
  </g>
  <text x="290" y="180" font-size="26" fill="#1E9BF0">→</text>
  <!-- tahap 2 -->
  <g>
    <path d="M340 200 q 0 -60 60 -60 q 60 0 60 60 l 0 20 l -22 0 l 0 -18 q 0 -14 -12 -14 l -52 0 q -12 0 -12 14 l 0 18 l -22 0 z" fill="#93C5FD" stroke="#0A5FC0" stroke-width="4"/>
    <rect x="370" y="126" width="18" height="34" fill="#FBBF24" stroke="#B45309" stroke-width="3"/>
    <rect x="412" y="126" width="18" height="34" fill="#FBBF24" stroke="#B45309" stroke-width="3"/>
    <text x="400" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#0F3057">2. Kompleks enzim–substrat</text>
    <text x="400" y="270" text-anchor="middle" font-size="12" fill="#7E93AB">sisi aktif menyesuaikan (induced fit),</text>
    <text x="400" y="286" text-anchor="middle" font-size="12" fill="#7E93AB">energi aktivasi turun</text>
  </g>
  <text x="510" y="180" font-size="26" fill="#1E9BF0">→</text>
  <!-- tahap 3 -->
  <g>
    <path d="M560 200 q 0 -60 60 -60 q 60 0 60 60 l 0 20 l -22 0 l 0 -18 q 0 -14 -12 -14 l -52 0 q -12 0 -12 14 l 0 18 l -22 0 z" fill="#BFDBFE" stroke="#0A5FC0" stroke-width="4"/>
    <rect x="590" y="112" width="16" height="22" fill="#34D399" stroke="#047857" stroke-width="3"/>
    <rect x="612" y="112" width="16" height="22" fill="#34D399" stroke="#047857" stroke-width="3"/>
    <path d="M600 96 q 10 -18 20 0" fill="none" stroke="#047857" stroke-width="3"/>
    <text x="620" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#0F3057">3. Produk lepas, enzim UTUH</text>
    <text x="620" y="270" text-anchor="middle" font-size="12" fill="#7E93AB">enzim tidak ikut berubah/habis,</text>
    <text x="620" y="286" text-anchor="middle" font-size="12" fill="#7E93AB">siap dipakai lagi</text>
  </g>
  <!-- faktor -->
  <rect x="60" y="330" width="780" height="150" rx="14" fill="#FFFFFF" stroke="#E1ECF8"/>
  <text x="80" y="358" font-size="15" font-weight="700" fill="#0F3057">Faktor yang mempengaruhi kerja enzim</text>
  <g font-size="13.5" fill="#33506E">
    <text x="80" y="384">• Suhu: optimum ±37°C pada manusia; terlalu panas → denaturasi (bentuk sisi aktif berubah permanen); terlalu dingin → reaksi sangat lambat.</text>
    <text x="80" y="408">• pH: tiap enzim punya pH optimum (pepsin ±2 di lambung; tripsin ±8 di usus).</text>
    <text x="80" y="432">• Konsentrasi substrat &amp; enzim: makin banyak substrat, reaksi naik hingga semua sisi aktif jenuh.</text>
    <text x="80" y="456">• Aktivator (ion logam Mg²⁺, Ca²⁺) mempercepat; inhibitor (kompetitif menutup sisi aktif; non-kompetitif mengubah bentuk enzim) memperlambat.</text>
  </g>
</svg>
