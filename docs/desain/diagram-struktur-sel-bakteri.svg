<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="560" fill="#F7FBFF"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0F3057">Struktur Sel Bakteri (Prokariotik)</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#7E93AB">Diagram orisinal Tim Kurikulum Bimbel Gemilang</text>
  <!-- sel -->
  <g>
    <ellipse cx="400" cy="320" rx="250" ry="140" fill="#EAF4FE" stroke="#0A5FC0" stroke-width="10"/>
    <ellipse cx="400" cy="320" rx="228" ry="120" fill="#FFFFFF" stroke="#1E9BF0" stroke-width="5"/>
    <!-- nukleoid -->
    <path d="M300 320 q 30 -55 70 -18 q 40 36 78 -6 q 38 -42 76 0 q 30 33 62 6" fill="none" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
    <text x="400" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">Nukleoid (DNA)</text>
    <!-- plasmid -->
    <circle cx="300" cy="382" r="24" fill="none" stroke="#16A34A" stroke-width="5"/>
    <text x="300" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#16A34A">Plasmid</text>
    <!-- ribosom -->
    <g fill="#B45309">
      <circle cx="480" cy="372" r="7"/><circle cx="512" cy="352" r="7"/><circle cx="452" cy="398" r="7"/><circle cx="540" cy="386" r="7"/>
    </g>
    <text x="500" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">Ribosom</text>
    <!-- flagela -->
    <path d="M650 320 q 40 -26 78 0 q 38 26 78 0 q 30 -20 62 -6" fill="none" stroke="#0A5FC0" stroke-width="6" stroke-linecap="round"/>
    <text x="800" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#0A5FC0">Flagela</text>
    <!-- pili -->
    <g stroke="#0E7AD4" stroke-width="4" stroke-linecap="round">
      <line x1="180" y1="240" x2="150" y2="216"/><line x1="162" y1="300" x2="126" y2="292"/><line x1="176" y1="372" x2="142" y2="392"/>
    </g>
    <text x="120" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#0E7AD4">Pili</text>
  </g>
  <!-- legenda lapisan -->
  <g font-size="14">
    <rect x="640" y="90" width="230" height="150" rx="12" fill="#FFFFFF" stroke="#E1ECF8"/>
    <text x="656" y="116" font-weight="700" fill="#0F3057">Lapisan pembungkus:</text>
    <rect x="656" y="128" width="16" height="16" fill="#0A5FC0"/><text x="680" y="141" fill="#33506E">Kapsul (lendir pelindung)</text>
    <rect x="656" y="152" width="16" height="16" fill="#1E9BF0"/><text x="680" y="165" fill="#33506E">Dinding sel (peptidoglikan)</text>
    <rect x="656" y="176" width="16" height="16" fill="#FFFFFF" stroke="#1E9BF0" stroke-width="3"/><text x="680" y="189" fill="#33506E">Membran plasma</text>
    <text x="656" y="216" font-size="12.5" fill="#7E93AB">Gram + : peptidoglikan tebal</text>
    <text x="656" y="232" font-size="12.5" fill="#7E93AB">Gram − : tipis + selubung luar</text>
  </g>
  <!-- catatan fungsi -->
  <g font-size="13.5" fill="#33506E">
    <text x="40" y="492">• Tidak memiliki membran inti → materi genetik bebas di sitoplasma (nukleoid).</text>
    <text x="40" y="514">• Plasmid membawa gen tambahan (mis. gen resistensi antibiotik) dan dapat berpindah antarbakteri (konjugasi).</text>
    <text x="40" y="536">• Reproduksi aseksual dengan pembelahan biner; kondisi buruk → endospora pada beberapa jenis.</text>
  </g>
</svg>
